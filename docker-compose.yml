services:
  postgres:
    image: postgres:16
    container_name: mentor-postgres
    environment:
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD: mentor123
      POSTGRES_DB: mentor_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor -d mentor_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: